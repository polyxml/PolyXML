[project]
site_url = "https://polyxml.github.io/PolyXML/"
site_name = "PolyXML"
site_description = "Next-gen polyglot XML Schema (XSD) compiler and high-throughput streaming serialization engine for Rust, Python, Go, C++20, Java, TypeScript, WebAssembly, and C#."
repo_url = "https://github.com/polyxml/PolyXML"
repo_name = "polyxml/PolyXML"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/brand.css"]

nav = [
    { "Overview" = "index.md" },
    { "Quickstart" = "quickstart.md" },
    { "Why PolyXML?" = "why-polyxml.md" },
    { "Languages" = [
        { "Overview" = "languages/index.md" },
        { "Rust" = "languages/rust.md" },
        { "Python" = "languages/python.md" },
        { "TypeScript & Node.js" = "languages/node.md" },
        { "WebAssembly" = "languages/wasm.md" },
        { "Go" = "languages/go.md" },
        { "C++20" = "languages/cpp.md" },
        { "Java" = "languages/java.md" },
        { "C#" = "languages/csharp.md" },
    ]},
    { "Guides" = [
        { "Overview" = "guides/index.md" },
        { "Schema Compiler & CLI" = "guides/compiler.md" },
        { "Transcoding & Streaming" = "guides/transcoding.md" },
        { "Polymorphism & Dynamic Dispatch" = "guides/polymorphism.md" },
    ]},
    { "Architecture" = "architecture.md" },
    { "Benchmarks" = [
        { "Overview & Map" = "benchmarks/index.md" },
        { "Serializer Comparisons" = "benchmarks/serializer-comparison-2026-10.md" },
        { "Cross-Language Results" = "benchmarks/language-results-2026-09.md" },
        { "Python AOT vs Dataclass" = "benchmarks/python-aot-vs-dataclass.md" },
        { "Python JSON & Binary AOT" = "benchmarks/python-json-binary-aot-2026-09.md" },
        { "Rust PHF Dispatch" = "benchmarks/rust-phf-dispatch.md" },
        { "WebAssembly vs JavaScript" = "benchmarks/wasm-vs-js.md" },
    ]},
]

[project.theme]
language = "en"
logo = "assets/brand/logo_polyxml_icon.png"
favicon = "assets/brand/logo_polyxml_icon.png"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown.extensions]
toc = { permalink = "#" }
admonition = {}
codehilite = {}
footnotes = {}
attr_list = {}
md_in_html = {}
def_list = {}

[project.markdown.extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown.extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown.extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
slugify = "pymdownx.slugs:slugify"
