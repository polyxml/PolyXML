[package]
name = "polyxml-python"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Python bindings for PolyXML (polyxml-core)"

[lib]
name = "_polyxml"
crate-type = ["cdylib"]

[dependencies]
polyxml = { path = "../polyxml-core" }
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }
lexical-core = "1.0"
smallvec = "1.16"
hex = "0.4"
base64 = "0.23"
