[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "polyxml"
version = "0.33.2"
description = "High-performance, polyglot XML data-binding engine built in Rust"
authors = [
    { name = "Bailey Nguyen", email = "bailey.tan.nguyen@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
msgpack = [
    "msgspec>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pydantic>=2.7.0",
    "ruff>=0.4.0",
    "msgspec>=0.18.0",
]

[project.urls]
Homepage = "https://github.com/polyxml/PolyXML"
Documentation = "https://polyxml.github.io/PolyXML/"
Repository = "https://github.com/polyxml/PolyXML"
Issues = "https://github.com/polyxml/PolyXML/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "polyxml._polyxml"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--color=yes"

[tool.coverage.run]
branch = true
source = ["polyxml"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["polyxml"]
