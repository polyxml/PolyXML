name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # -------------------------------------------------------------
  # 1. Rust Workspace: Formatter, Clippy & Workspace Tests
  # -------------------------------------------------------------
  rust-check:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Multi-Language Version Parity
        run: python scripts/sync_version.py --check

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Initialize .NET Environment
        run: |
          dotnet --info
          dotnet new console -o /tmp/dotnet-init --force
          dotnet build /tmp/dotnet-init
          rm -rf /tmp/dotnet-init

      - name: Run Core & C-ABI Tests
        run: cargo test -p polyxml -p polyxml-c --verbose

      - name: Verify Pinned UBL 2.4 C# Corpus
        run: python scripts/verify_ubl_csharp.py

      - name: Build C-ABI Shared Library (Artifact)
        run: cargo build --release -p polyxml-c

      - name: Upload Native Lib
        uses: actions/upload-artifact@v7
        with:
          name: polyxml-native-linux
          path: target/release/libpolyxml.so

  # -------------------------------------------------------------
  # 2. Python Matrix: 100% Coverage on Linux, macOS, Windows
  # -------------------------------------------------------------
  python-check:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: rust-check
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build PolyXML CLI Binary
        run: cargo build -p polyxml-cli

      - name: Build and Install PolyXML Python Extension
        working-directory: crates/polyxml-python
        run: uv pip install --system -e ".[dev]"

      - name: Ruff Linter
        working-directory: crates/polyxml-python
        run: ruff check python/ tests/

      - name: Pytest with 100% Coverage Enforcement
        working-directory: crates/polyxml-python
        run: pytest --cov=polyxml --cov-branch --cov-fail-under=100 -v

  # -------------------------------------------------------------
  # 3. C++20 Bindings: CMake Build & CTest
  # -------------------------------------------------------------
  cpp-check:
    name: C++20 Bindings
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Library
        run: cargo build --release -p polyxml-c

      - name: Configure CMake
        working-directory: bindings/cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Test
        working-directory: bindings/cpp
        run: cmake --build build --config Release

      - name: Run C++ Test Suite
        working-directory: bindings/cpp/build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: ./test_polyxml

  # -------------------------------------------------------------
  # 4. Go Bindings: Cgo Build & Test
  # -------------------------------------------------------------
  go-check:
    name: Go Bindings
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Library
        run: cargo build --release -p polyxml-c

      - name: Check Go module header
        run: cmp crates/polyxml-c/include/polyxml.h bindings/go/polyxml.h

      - name: Check Go module fixture
        run: cmp tests/fixtures/atom_feed.xml bindings/go/testdata/atom_feed.xml

      - name: Run Go Tests
        working-directory: bindings/go
        env:
          CGO_LDFLAGS: "-L${{ github.workspace }}/target/release -lpolyxml"
          LD_LIBRARY_PATH: "${{ github.workspace }}/target/release"
        run: go test -v ./...

  # -------------------------------------------------------------
  # 5. Node.js / TypeScript: NAPI Build & Test
  # -------------------------------------------------------------
  node-check:
    name: Node.js ${{ matrix.node-version }}
    needs: rust-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NAPI CLI
        run: npm install -g @napi-rs/cli

      - name: Build NAPI Addon
        working-directory: crates/polyxml-js
        run: napi build --platform --release

      - name: Run Node.js Tests
        working-directory: crates/polyxml-js
        run: npm test

  # -------------------------------------------------------------
  # 6. WebAssembly: build and exercise the publishable package
  # -------------------------------------------------------------
  wasm-check:
    name: WebAssembly package
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust and Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build Wasm npm package
        run: ./crates/polyxml-wasm/build.sh

      - name: Test Wasm package
        run: node --test crates/polyxml-wasm/test/*.test.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Test Wasm package with Bun
        run: bun test crates/polyxml-wasm/test/wasm.test.mjs

      - name: Validate npm package contents
        run: npm pack --dry-run ./crates/polyxml-wasm/pkg

      - name: Install browser benchmark dependencies
        run: npm ci --prefix benchmarks/typescript-wasm

      - name: Smoke test Node and Bun benchmarks
        run: |
          node --expose-gc benchmarks/typescript-wasm/bench.mjs micro
          bun benchmarks/typescript-wasm/bench.mjs micro

      - name: Install headless Chromium
        run: npm exec --prefix benchmarks/typescript-wasm -- playwright install chromium-headless-shell

      - name: Smoke test browser Wasm runtime
        run: node benchmarks/typescript-wasm/browser-runner.mjs micro

  # -------------------------------------------------------------
  # 7. Java Bindings: OpenJDK 22 & Maven Test (Panama FFI)
  # -------------------------------------------------------------
  java-check:
    name: Java 22 (Panama FFI)
    needs: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Native Library
        run: cargo build --release -p polyxml-c

      - name: Run Maven Tests
        working-directory: bindings/java
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: mvn test -DargLine="--enable-native-access=ALL-UNNAMED -Djava.library.path=${{ github.workspace }}/target/release"
