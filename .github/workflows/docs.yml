name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Rust and Wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Zensical
        run: uv pip install --system zensical

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build Docs
        run: zensical build --clean --strict

      - name: Build Playground WASM Bundle
        run: |
          wasm-pack build crates/polyxml-wasm --target web --release --out-dir "${{ github.workspace }}/site/playground/pkg" -- --features codegen
          rm -f site/playground/pkg/.gitignore site/playground/pkg/package.json site/playground/pkg/README.md
          test -f site/playground/index.html
          test -f site/playground/pkg/polyxml_wasm.js
          test -f site/playground/pkg/polyxml_wasm_bg.wasm

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
