[workspace]
resolver = "2"
members = [
    "crates/polyxml-core",
    "crates/polyxml-python",
    "crates/polyxml-c",
    "crates/polyxml-js",
    "crates/polyxml-wasm",
    "crates/polyxml-cli",
]

[workspace.package]
version = "0.33.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Bailey Nguyen <bailey.tan.nguyen@gmail.com>"]
repository = "https://github.com/polyxml/PolyXML"
homepage = "https://polyxml.github.io/PolyXML/"
keywords = ["xml", "deserializer", "serializer", "data-binding", "polyglot"]
categories = ["parsing", "encoding"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
